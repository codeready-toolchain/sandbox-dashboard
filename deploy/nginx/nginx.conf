# "auto" lets Nginx use as many worker processes as available CPU cores.
worker_processes auto;

# The logs with severity "error" or above will be printed to stderr.
error_log /dev/stderr error;

# Define the file that will store the process ID of the main process. Needed
# by Nginx for signal handling and process management.
pid /run/nginx.pid;

events {
    # Sets the maximum number of simultaneous connections per worker.
    worker_connections 1024;
}

http {
    # Do not include the Nginx version in the response headers, for security
    # reasons.
    server_tokens off;

    # Map all the known file extensions to their media formats.
    include /etc/nginx/mime.types;

    # Fallback for unrecognized mime types.
    default_type application/octet-stream;

    # Use Kernel's "sendfile" instead of the "read" + "write" cycle for
    # increased efficiency, since we are only serving files from the disk
    # to the network, nothing else.
    sendfile on;

    # Optimize sending the file over the network. Packs the headers and the
    # body into fewer fuller packets before being sent.
    tcp_nopush on;

    # Works in combination with "tcp_nopush". Full packets are sent first, and
    # the final chunk is pushed without delay on keepalive connections.
    tcp_nodelay on;

    # Enable compression for the files.
    gzip on;

    # Send a "Vary: Accept-Encoding" header to prevent intermediate proxies or
    # caches to serve a compressed response to a client that does not support
    # gzip compression.
    gzip_vary on;

    # Specify a minimum size for the compression to avoid compressing files
    # that are too small and would burn CPU cycles for no clear benefit.
    gzip_min_length 256;

    # Define which kind of files we are compressing. The "text/html" one is
    # always compressed by default so it does not need to be specified.
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

    # Maximum time in seconds we keep the "keepalive" connections before
    # killing them.
    keepalive_timeout 30;

    # Define our server block for the user interface.
    server {
        # Print the access logs to the standard output.
        access_log /dev/stdout;

        # Define which port Nginx will be listening to for requests.
        listen 8080;

        # Define where the user interface lives.
        root /opt/app-root/src;

        # Define initial file that will be served.
        index index.html;

        # Include the security headers for the requests.
        include /etc/nginx/security-headers.conf;

        # For any request...
        location / {
            # ... try to serve the file specified in the URI. Otherwise try to
            # serve it as a directory. Fall back to the index.html file which
            # holds the SPA.
            try_files $uri $uri/ /index.html;
        }

        # For health check requests that exactly match the "/health" path...
        location = /health {
            # Turn off the access log to avoid polluting it with them.
            access_log off;

            # Return a "204 - No Content" response.
            return 204;
        }

        # For requests that match the following extensions, which takes
        # precedence over the catch-all location above, ...
        location ~* \.(css|eot|gif|ico|jpeg|jpg|js|png|svg|ttf|woff|woff2)$ {
            # ... add a "Cache-Control" header that:
            #
            # - Specifies that the response can be stored in a shared cache
            #   with the "public" directive.
            # - Specifies that the served contents are considered fresh for a
            #   year with the "max-age" directive.
            # - Specifies that the response will not change while it's still
            #   considered fresh with "immutable".
            add_header Cache-Control "immutable, max-age=31536000, public";

            # Reinclude the security headers in this block, as the security
            # "add_header" directives would not get inherited because we have
            # defined a custom "add_header" directive in this block.
            include /etc/nginx/security-headers.conf;
        }
    }
}
